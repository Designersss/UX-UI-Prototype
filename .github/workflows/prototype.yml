name: Prototype validation
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/overview.js
      - name: Run dependency-free UI model tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser layout and interaction checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aimock-http.log 2>&1 &
          node tests/browser-smoke.mjs
      - name: Store responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
